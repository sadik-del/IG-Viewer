<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram user</title>
    <link rel="icon" type="image/png" href="insta_dp.jpg">

        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="style.css">

    <!-- Instagram Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div class="left">

            <button class="back-btn">
                ←
            </button>

            <img src="insta_dp.jpg"
                 class="avatar"
                 id="avatar">

            <div>

                <div id="username" class="username">
                    Loading...
                </div>

                <div class="status">
                    Instagram user
                </div>

            </div>

        </div>

        <div class="right">

            <button class="icon-btn" title="Search">
                🔍
            </button>

            <button class="icon-btn" title="Information">
                ℹ️
            </button>

        </div>

    </header>

<div class="file-loader">
    <input
        type="file"
        id="jsonFile"
        accept=".json"
    >
</div>

    <!-- Chat Area -->

    <main id="chatContainer">

    </main>

    <!-- Scroll Button -->

    <button id="scrollBottom">

        ↓

    </button>

</div>

<script src="decoder.js"></script>
<script src="script.js"></script>

</body>
</html>
